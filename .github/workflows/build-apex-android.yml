name: Build Apex Golf AI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apex-android.yml"
      - "android-build/**"
      - "capacitor.config.json"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "index.html"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout existing Apex Golf AI source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK on GitHub runner
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python for launcher icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install original Apex dependencies
        run: npm ci --no-audit --no-fund

      - name: Add Android build tooling without replacing app dependencies
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund \
            @capacitor/core@8.5.3 @capacitor/cli@8.5.3 @capacitor/android@8.5.3

      - name: Prepare approved Apex Midnight launcher artwork
        run: |
          python -m pip install --quiet pillow
          python android-build/generate_icons.py

      - name: Verify golf GPS and automatic club gapping regressions
        run: node --test android-build/shot-plan.test.mjs android-build/gps-tracking.test.mjs android-build/auto-gapping.test.mjs

      - name: Build the actual Apex Golf AI web screens
        env:
          VITE_BASE44_APP_ID: 6ad8bc88f9e44631e3842d43
          VITE_BASE44_BACKEND_URL: https://base44.app
          VITE_BASE44_FUNCTIONS_VERSION: preview
        run: |
          npm run build
          test -f dist/index.html
          test -d dist/assets
          test -f dist/icon-512.png

      - name: Generate Android container and bundle web app
        run: |
          npx cap add android
          npx cap sync android

      - name: Add device permissions and the genuine Apex icon
        run: |
          python -m pip install --quiet pillow
          python android-build/prepare_android.py

      - name: Assemble one installable APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Validate and name APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk APEX-GOLF-AI.apk
          unzip -tqq APEX-GOLF-AI.apk
          test -s APEX-GOLF-AI.apk
          ls -lh APEX-GOLF-AI.apk

      - name: Preserve installable APK in Actions
        uses: actions/upload-artifact@v4
        with:
          name: APEX-GOLF-AI-ANDROID
          path: APEX-GOLF-AI.apk
          retention-days: 30
          if-no-files-found: error

      - name: Provide one direct APK download from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apex-golf-ai-android-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" APEX-GOLF-AI.apk --clobber
            gh release edit "$TAG" --title "APEX Golf AI — Midnight Edition APK" --notes "Official Apex Midnight redesign: navy, teal and gold, with the approved gold Apex launcher icon. Built from the same Apex Golf AI Base44 project. GPS, Caddie, Bag, Scorecard, Swing and Course Lab preserved."
          else
            gh release create "$TAG" APEX-GOLF-AI.apk \
              --title "APEX Golf AI — Android APK" \
              --notes "Signed installable Android debug APK of the existing 166-file Base44 Apex Golf AI project. Includes the golf GPS, Caddie, scorecard, bag, swing and course-lab screens. Internet is required for live Base44 services and map imagery."
          fi
