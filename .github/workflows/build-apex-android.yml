name: Build Apex Golf AI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/course-split-50-50-20261023", "codex/auto-single-hole-build69-20261024", "codex/restore-vibrant-home-build76", "codex/s24-course-search-build77", "codex/fix-tee-green-direction-build78"]
    paths:
      - ".github/workflows/build-apex-android.yml"
      - "android-build/**"
      - "capacitor.config.json"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "index.html"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout existing Apex Golf AI source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK on GitHub runner
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python for launcher icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install original Apex dependencies
        run: npm ci --no-audit --no-fund

      - name: Add Android build tooling without replacing app dependencies
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund \
            @capacitor/core@8.5.3 @capacitor/cli@8.5.3 @capacitor/android@8.5.3

      - name: Prepare approved Apex Midnight launcher artwork
        run: |
          python -m pip install --quiet pillow
          python android-build/generate_icons.py

      - name: Verify GPS, bag management and automatic club gapping
        run: node --test android-build/caddie-history.test.mjs android-build/shot-plan.test.mjs android-build/launch-import.test.mjs android-build/gps-tracking.test.mjs android-build/auto-gapping.test.mjs android-build/club-bag.test.mjs android-build/course-search.test.mjs android-build/hole-orientation.test.mjs

      - name: Verify approved add-on pages are included
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync } from 'node:fs';
          const required = [
            ['Home', 'src/pages/Home.jsx', 'path="/"'],
            ['GPS', 'src/pages/Rangefinder.jsx', 'path="/play"'],
            ['Club Bag', 'src/pages/Bag.jsx', 'path="/bag"'],
            ['Caddie', 'src/pages/Caddie.jsx', 'path="/caddie"'],
            ['Scorecard', 'src/pages/Scorecard.jsx', 'path="/scorecard"'],
            ['Green Reader Camera', 'src/pages/GreenReader.jsx', 'path="/green-reader"'],
            ['Shot History', 'src/pages/ShotHistory.jsx', 'path="/shot-history"'],
            ['Shot Studio', 'src/pages/ShotStudio.jsx', 'path="/shot-studio"'],
            ['Biometrics', 'src/pages/Biometrics.jsx', 'path="/biometrics"'],
            ['S24-Lenny Pairing', 'src/pages/Pairing.jsx', 'path="/pairing"'],
            ['Tour Suite', 'src/pages/TourSuite.jsx', 'path="/tour-suite"'],
          ];
          const app = readFileSync('src/App.jsx', 'utf8');
          if (!existsSync('public/apex-home-hero.png')) throw new Error('Approved Home artwork missing');
          for (const [label, file, route] of required) {
            if (!existsSync(file) || !app.includes(route)) {
              throw new Error(label + ' is missing from the unified Apex app: ' + file + ', route ' + route);
            }
            console.log('Present: ' + label);
          }
          JS

      - name: Build the actual Apex Golf AI web screens
        env:
          VITE_BASE44_APP_ID: 6ad8bc88f9e44631e3842d43
          VITE_BASE44_BACKEND_URL: https://base44.app
          VITE_BASE44_FUNCTIONS_VERSION: preview
        run: |
          npm run build
          test -f dist/index.html
          test -d dist/assets
          test -f dist/icon-512.png

      - name: Generate Android container and bundle web app
        run: |
          npx cap add android
          npx cap sync android

      - name: Add device permissions and the genuine Apex icon
        run: |
          python -m pip install --quiet pillow
          python android-build/prepare_android.py

      - name: Assemble one installable APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Validate and name APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk APEX-GOLF-AI.apk
          unzip -tqq APEX-GOLF-AI.apk
          test -s APEX-GOLF-AI.apk
          ls -lh APEX-GOLF-AI.apk

      - name: Preserve installable APK in Actions
        uses: actions/upload-artifact@v4
        with:
          name: APEX-GOLF-AI-ANDROID
          path: APEX-GOLF-AI.apk
          retention-days: 30
          if-no-files-found: error

      - name: Provide one direct APK download from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apex-golf-ai-hole-direction-build78"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" APEX-GOLF-AI.apk --clobber
            gh release edit "$TAG" --title "APEX Golf AI — Build 78 Tee and Green Direction APK" --notes "Build 78 corrects OSM hole endpoint direction against mapped tee and green features; refreshes old hole geometry but keeps saved courses, scores and shot plans. Keeps Build 77 search and the approved 60/40 vibrant UI. Verify actual hole locations before use."
          else
            gh release create "$TAG" APEX-GOLF-AI.apk \
              --target "$GITHUB_SHA" \
              --title "APEX Golf AI — Build 78 Tee and Green Direction APK" \
              --notes "Build 78: tee-red, target-yellow and green-green marker positions checked against OSM tee/green survey features. Old map cache refreshes without deleting saved courses. Search and 60/40 layout preserved; verify physical positions on S24 and Lenny."
          fi
